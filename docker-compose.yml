services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pantau-laravel-app
    restart: unless-stopped
    ports:
      - "8016:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8016
      GBP_API_BASE_URL: http://gbpscrap:3016
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      gbpscrap:
        condition: service_healthy
    networks:
      - pantau-network
      - mariadb-network

  gbpscrap:
    build:
      context: .
      dockerfile: gbpscrap/Dockerfile
    container_name: pantau-gbpscrap
    restart: unless-stopped
    ports:
      - "3016:3016"
    environment:
      PORT: 3016
      HOST: 0.0.0.0
      HEADLESS: "true"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3016/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pantau-network

networks:
  pantau-network:
    driver: bridge
  mariadb-network:
    external: true
    name: mariadbphpmyadmin_db_network
